name: Selenium Automation

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:
    inputs:
      execution_mode:
        description: "Choose automation execution mode"
        required: true
        default: "testng"
        type: choice
        options:
          - testng
          - serenity


jobs:

  automation-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven


      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1


      - name: Verify Environment
        run: |
          java -version
          mvn -version
          google-chrome --version


      - name: Build Project
        run: mvn clean compile


      # Existing TestNG execution
      - name: Execute TestNG Suite
        if: github.event.inputs.execution_mode == 'testng' || github.event.inputs.execution_mode == ''
        run: mvn test


      # New Serenity execution
      - name: Execute Serenity BDD Suite
        if: github.event.inputs.execution_mode == 'serenity'
        run: mvn clean verify -Pserenity


      # Upload TestNG / Maven reports
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestNG-Reports
          path: |
            test-output
            target/surefire-reports


      # Upload Serenity report
      - name: Upload Serenity Report
        if: always() && github.event.inputs.execution_mode == 'serenity'
        uses: actions/upload-artifact@v4
        with:
          name: Serenity-Report
          path: target/site/serenity
